- name: Catherine M.
  quote: Charlie was super quick to respond, and he was knowledgeable and very reasonably priced! 10/10 recommend!

- name: Rori O.
  quote: Charlie was absolutely amazing! He installed floor-to-ceiling curtains flawlessly, fixed the lights that were too high for me to reach even with a ladder, installed a TV, assembled two beds, and tackled so much more with incredible skill and efficiency.

- name: Darcey M.
  quote: WOW, is all I can say! Charlie is very kind, honest, thorough, and extremely reasonably priced. He diagnosed the issue with our washer, we ordered the part, and he was here the day after we received it and bing, bang, boom — we were doing laundry!
