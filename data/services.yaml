- title: Plumbing & Electrical Help
  description: From dripping faucets to flickering lights, Charlie can tackle minor plumbing and electrical jobs like replacing fixtures, unclogging drains, and installing outlets or dimmers.

- title: General Repairs
  description: Loose hinges, leaky faucets, cracked drywall, or squeaky doors? Charlie handles all the common household fixes that keep your home in top shape.

- title: Outdoor & Seasonal Maintenance
  description: From gutter cleaning and deck repair to pressure washing and siding fixes, Charlie helps maintain your home's exterior and can handle indoor seasonal tasks like air filter changes and caulking, too.

- title: Installation & Mounting
  description: "Whether it's hanging blinds, mounting a TV, or installing appliances and vanities, Charlie ensures everything is safely and securely installed, just the way you want it."

- title: Carpentry & Custom Builds
  description: Need shelves, trim work, or even a small shed? From fixing fences to custom carpentry and crown molding, Charlie brings precision and craftsmanship to every woodwork task.

- title: Painting & Surface Finishing
  description: Freshen up your space with light painting, deck staining, or touch-ups. Charlie makes your interiors and exteriors look clean and polished again.
