<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{{- $title := .Title -}}
{{- $siteTitle := site.Title -}}
{{- $pageTitle := cond .IsHome $siteTitle (printf "%s · %s" $title $siteTitle) -}}
<title>{{ $pageTitle }}</title>

{{- $desc := .Params.description | default site.Params.description -}}
<meta name="description" content="{{ $desc }}">

<meta property="og:title" content="{{ $pageTitle }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ site.Params.ogImage | absURL }}">
<meta name="twitter:card" content="summary_large_image">

<link rel="canonical" href="{{ .Permalink }}">

<link rel="icon" href="/images/Logo_Black.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="/images/Logo_White.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/Logo_Black.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="/css/output.css">

{{- with .OutputFormats.Get "RSS" }}
<link rel="alternate" type="{{ .MediaType.Type }}" href="{{ .RelPermalink }}" title="{{ $siteTitle }}">
{{- end }}
