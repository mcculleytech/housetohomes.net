{{ define "main" }}
<section class="max-w-2xl mx-auto px-4 py-20 text-center">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-purple text-white">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <polyline points="5,13 10,18 20,7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1 class="mt-6 font-display text-4xl text-purple-dark">Thanks &mdash; we got it.</h1>
  <p class="mt-4 text-muted text-lg">Charlie will follow up with you shortly. In the meantime, if it's urgent, feel free to call:</p>
  <p class="mt-3"><a href="tel:{{ site.Params.phoneTel }}" class="btn-primary">Call {{ site.Params.phone }}</a></p>
  <p class="mt-10"><a href="/" class="text-purple hover:underline">&larr; Back to home</a></p>
</section>
{{ end }}
